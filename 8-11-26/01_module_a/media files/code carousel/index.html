<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Five-Panel Code Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="scene" tabindex="0" aria-label="Rotating five-panel code carousel">
            <div class="carousel">
                <article class="panel"><strong>HTML</strong><span>&lt;structure&gt;</span></article>
                <article class="panel"><strong>CSS</strong><span>{ style }</span></article>
                <article class="panel"><strong>JS</strong><span>() =&gt; logic</span></article>
                <article class="panel"><strong>PHP</strong><span>&lt;? server</span></article>
                <article class="panel"><strong>SQL</strong><span>SELECT *</span></article>
            </div>
        </section>
    </main>
</body>
</html>
