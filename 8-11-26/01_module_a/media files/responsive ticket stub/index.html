<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Responsive Ticket Stub</title><link rel="stylesheet" href="../assets/task-shell.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <article class="ticket" tabindex="0">
            <section class="ticket__main">
                <p class="ticket__eyebrow">Programming Wizards Live</p>
                <h1>Build Night</h1>
                <dl>
                    <div><dt>Date</dt><dd>08 AUG 2026</dd></div>
                    <div><dt>Time</dt><dd>6:30 PM</dd></div>
                    <div><dt>Venue</dt><dd>Wizard Lab</dd></div>
                </dl>
            </section>
            <aside class="ticket__stub" aria-label="Admission details">
                <span class="ticket__code">PW-0826</span>
                <span class="ticket__admit">Admit one</span>
                <span class="ticket__bars" aria-hidden="true"></span>
            </aside>
        </article>
    </main>
</body>
</html>
