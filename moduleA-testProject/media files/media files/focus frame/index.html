<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A1 · Focus Frame</title>
    <link rel="stylesheet" href="../assets/task-shell.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <article class="focus-card">
            <a href="#caption">
                <img src="media/photo.jpg" alt="Laptop on a softly lit programmer's desk">
            </a>
            <span class="bracket top-left" aria-hidden="true"></span>
            <span class="bracket top-right" aria-hidden="true"></span>
            <span class="bracket bottom-left" aria-hidden="true"></span>
            <span class="bracket bottom-right" aria-hidden="true"></span>
            <p id="caption" class="caption">Build with focus.</p>
        </article>
    </main>
</body>
</html>
