<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Isometric Cube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="cube" tabindex="0" aria-label="Three-faced isometric cube with a code mark">
            <div class="cube-object" aria-hidden="true">
                <div class="face face-top"></div>
                <div class="face face-left">&lt;/</div>
                <div class="face face-right">&gt;</div>
            </div>
        </div>
    </main>
</body>
</html>
