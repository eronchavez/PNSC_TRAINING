<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live Character Budget Counter</title><link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="composer" aria-labelledby="composer-title">
            <label for="message">Announcement</label>
            <textarea id="message" maxlength="120" rows="6" aria-describedby="counter hint"></textarea>
            <div class="meta">
                <span id="hint">Maximum 120 characters</span>
                <output id="counter" for="message" aria-live="polite">120 remaining</output>
            </div>
            <div class="budget" role="progressbar" aria-label="Message characters used" aria-valuemin="0" aria-valuemax="120" aria-valuenow="0">
                <span></span>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
